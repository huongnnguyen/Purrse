spring.application.name=purrse

# Database (override with env vars, or put overrides in application-local.properties, which is gitignored)
spring.datasource.url=${PURRSE_DB_URL:jdbc:postgresql://localhost:5432/purrse_dev}
spring.datasource.username=${PURRSE_DB_USER:postgres}
spring.datasource.password=${PURRSE_DB_PASSWORD:}

# Tables already exist from the hand-written SQL; only add anything that is missing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
spring.config.import=optional:file:./application-local.properties
