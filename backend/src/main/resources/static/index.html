<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrse</title>
<style>
  :root {
    --bg: #faf6f1; --card: #ffffff; --ink: #2b2623; --muted: #7a706a; --line: #eadfd5;
    --accent: #c4577a; --accent-ink: #ffffff; --good: #2f8f5b; --bad: #c0443a; --bar: #e9b8c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1716; --card: #26211f; --ink: #f3ece6; --muted: #a79a92; --line: #3a322f;
      --accent: #e07a9d; --accent-ink: #1b1716; --good: #5fcf92; --bad: #ee7b70; --bar: #6b3d4d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 28px 8px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  header span { color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 28px 48px; display: grid; gap: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 26px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 12px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .empty { color: var(--muted); padding: 8px 0; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  input, select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input, select { min-width: 0; flex: 1 1 120px; }
  button { cursor: pointer; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 400; padding: 3px 8px; }
  button.ghost:hover { color: var(--bad); border-color: var(--bad); }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bar.cat > i { background: var(--bar); }
  .row { margin: 10px 0; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .sub { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .actions input { flex: 0 1 90px; padding: 4px 8px; }
  .actions button { padding: 4px 10px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 10px 16px; border-radius: 10px; display: none; max-width: 90vw; }
</style>
</head>
<body>
<header><h1>🐾 Purrse</h1><span>your money, kept close</span></header>
<main>
  <section class="stats" id="stats"></section>

  <div class="cols">
    <section class="card">
      <h2>Accounts</h2>
      <div id="accounts"></div>
      <form id="accountForm">
        <input name="name" placeholder="Account name" required>
        <select name="type"><option>checking</option><option>savings</option><option>credit</option><option>cash</option></select>
        <input name="balance" type="number" step="0.01" min="0" placeholder="Starting balance">
        <button>Add account</button>
      </form>
    </section>

    <section class="card">
      <h2>Spending by category</h2>
      <div id="categories"></div>
    </section>
  </div>

  <section class="card">
    <h2>Transactions</h2>
    <form id="txnForm">
      <select name="accountId" id="txnAccount" required></select>
      <input name="merchant" placeholder="Merchant" required>
      <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
      <input name="category" placeholder="Category" list="catList">
      <datalist id="catList"></datalist>
      <input name="date" type="date" required>
      <select name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      <button>Add</button>
    </form>
    <div id="txns" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <h2>Savings goals</h2>
    <div id="goals"></div>
    <form id="goalForm">
      <input name="name" placeholder="Goal name" required>
      <input name="targetAmount" type="number" step="0.01" min="0.01" placeholder="Target amount" required>
      <input name="deadline" type="date" title="Deadline (optional)">
      <button>Add goal</button>
    </form>
  </section>
</main>
<div id="toast"></div>

<script>
const money = n => (Number(n) || 0).toLocaleString(undefined, { style: 'currency', currency: 'USD' });
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids) e.append(k);
  return e;
};

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 4000);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.detail || j.message || j.error || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
const act = fn => async (...a) => { try { await fn(...a); await load(); } catch (e) { toast(e.message); } };

function stat(label, value, cls = '') {
  return el('div', { class: 'card stat' }, el('div', { class: 'label' }, label), el('div', { class: 'value ' + cls }, money(value)));
}

function renderAccounts(accounts) {
  const box = document.getElementById('accounts'); box.replaceChildren();
  if (!accounts.length) box.append(el('div', { class: 'empty' }, 'No accounts yet — add one below.'));
  for (const a of accounts) {
    box.append(el('div', { class: 'row' },
      el('div', { class: 'top' },
        el('div', {}, el('strong', {}, a.name), ' ', el('span', { class: 'sub' }, a.type || '')),
        el('div', {}, money(a.balance), ' ',
          el('button', { class: 'ghost', title: 'Delete account and its transactions', onclick: act(async () => {
            if (confirm(`Delete "${a.name}" and all its transactions?`)) await api('/accounts/' + a.id, { method: 'DELETE' });
          }) }, '✕'))));
  }
  const sel = document.getElementById('txnAccount'); const prev = sel.value; sel.replaceChildren();
  for (const a of accounts) sel.append(el('option', { value: a.id }, a.name));
  if (prev) sel.value = prev;
}

function renderCategories(cats) {
  const box = document.getElementById('categories'); box.replaceChildren();
  if (!cats.length) { box.append(el('div', { class: 'empty' }, 'No expenses yet.')); return; }
  const max = Math.max(...cats.map(c => Number(c.total)));
  for (const c of cats) {
    const bar = el('div', { class: 'bar cat' }, el('i', { style: `width:${(Number(c.total) / max) * 100}%` }));
    box.append(el('div', { class: 'row' }, el('div', { class: 'top' }, el('span', {}, c.category), el('span', {}, money(c.total))), bar));
  }
  const dl = document.getElementById('catList'); dl.replaceChildren();
  for (const c of cats) dl.append(el('option', { value: c.category }));
}

function renderTxns(txns, accounts) {
  const box = document.getElementById('txns'); box.replaceChildren();
  if (!txns.length) { box.append(el('div', { class: 'empty' }, 'No transactions yet.')); return; }
  const names = Object.fromEntries(accounts.map(a => [a.id, a.name]));
  const table = el('table', {}, el('thead', {}, el('tr', {},
    ...['Date', 'Merchant', 'Category', 'Account'].map(h => el('th', {}, h)), el('th', { class: 'num' }, 'Amount'), el('th', {}))));
  const body = el('tbody');
  for (const t of txns) {
    const income = (t.type || '').toLowerCase() === 'income';
    body.append(el('tr', {},
      el('td', {}, t.date), el('td', {}, t.merchant), el('td', {}, t.category || ''), el('td', {}, names[t.accountId] || ''),
      el('td', { class: 'num ' + (income ? 'pos' : '') }, (income ? '+' : '−') + money(Math.abs(t.amount))),
      el('td', {}, el('button', { class: 'ghost', title: 'Delete', onclick: act(() => api('/transactions/' + t.id, { method: 'DELETE' })) }, '✕'))));
  }
  table.append(body); box.append(table);
}

function renderGoals(goals) {
  const box = document.getElementById('goals'); box.replaceChildren();
  if (!goals.length) box.append(el('div', { class: 'empty' }, 'No goals yet — what are you saving for?'));
  for (const g of goals) {
    const pct = Math.min(100, (Number(g.currentAmount) / Number(g.targetAmount)) * 100);
    const input = el('input', { type: 'number', step: '0.01', placeholder: 'Add $' });
    box.append(el('div', { class: 'row' },
      el('div', { class: 'top' },
        el('strong', {}, g.name),
        el('span', {}, `${money(g.currentAmount)} / ${money(g.targetAmount)}`)),
      el('div', { class: 'bar' }, el('i', { style: `width:${pct}%` })),
      el('div', { class: 'sub' }, `${pct.toFixed(0)}%` + (g.deadline ? ` · by ${g.deadline}` : '')),
      el('div', { class: 'actions' }, input,
        el('button', { onclick: act(async () => {
          const amount = parseFloat(input.value); if (!amount) return;
          await api(`/goals/${g.id}/contribute`, { method: 'POST', body: JSON.stringify({ amount }) });
        }) }, 'Add'),
        el('button', { class: 'ghost', title: 'Delete goal', onclick: act(async () => {
          if (confirm(`Delete goal "${g.name}"?`)) await api('/goals/' + g.id, { method: 'DELETE' });
        }) }, '✕'))));
  }
}

async function load() {
  try {
    const [dash, accounts, txns, goals] = await Promise.all([api('/dashboard'), api('/accounts'), api('/transactions'), api('/goals')]);
    const stats = document.getElementById('stats'); stats.replaceChildren(
      stat('Total balance', dash.totalBalance), stat('Income', dash.income, 'pos'),
      stat('Expenses', dash.expenses, 'neg'), stat('Net', dash.net, Number(dash.net) >= 0 ? 'pos' : 'neg'));
    renderAccounts(accounts); renderCategories(dash.spendByCategory); renderTxns(txns, accounts); renderGoals(goals);
  } catch (e) { toast('Could not load data: ' + e.message); }
}

function formData(form) {
  const o = Object.fromEntries(new FormData(form).entries());
  for (const k of Object.keys(o)) if (o[k] === '') delete o[k];
  for (const k of ['balance', 'amount', 'targetAmount']) if (k in o) o[k] = parseFloat(o[k]);
  if ('accountId' in o) o.accountId = parseInt(o.accountId, 10);
  return o;
}
function wire(id, path) {
  document.getElementById(id).addEventListener('submit', act(async e => {
    e.preventDefault();
    await api(path, { method: 'POST', body: JSON.stringify(formData(e.target)) });
    e.target.reset(); setToday();
  }));
}
// act() wraps the handler, but preventDefault must run synchronously — so guard it separately.
document.querySelectorAll('form').forEach(f => f.addEventListener('submit', e => e.preventDefault()));

function setToday() { document.querySelector('#txnForm [name=date]').valueAsDate = new Date(); }
wire('accountForm', '/accounts'); wire('txnForm', '/transactions'); wire('goalForm', '/goals');
setToday(); load();
</script>
</body>
</html>
